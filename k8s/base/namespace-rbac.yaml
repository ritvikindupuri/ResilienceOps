apiVersion: v1
kind: Namespace
metadata:
  name: sre-target-apps
  labels:
    arena.sre.io/role: victim
---
apiVersion: v1
kind: Namespace
metadata:
  name: sre-arena-control
  labels:
    arena.sre.io/role: control-plane
---
apiVersion: v1
kind: Namespace
metadata:
  name: sre-agent-sandbox
  labels:
    security.sre.io/tier: sandbox
    security.sre.io/quarantine: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-defender-sa
  namespace: sre-agent-sandbox
---
# Namespaced Role on the victim workloads only. ClusterRole was overly broad
# (cluster-wide pods/configmaps/networkpolicies plus invalid "describe" verbs).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-defender-target-role
  namespace: sre-target-apps
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-defender-target-binding
  namespace: sre-target-apps
subjects:
  - kind: ServiceAccount
    name: sre-defender-sa
    namespace: sre-agent-sandbox
roleRef:
  kind: Role
  name: sre-defender-target-role
  apiGroup: rbac.authorization.k8s.io
