<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1080" viewBox="0 0 2000 1080" role="img" aria-label="ResilienceOps architecture">
  <defs>
    <style>
      .title { font: 700 26px Arial, Helvetica, sans-serif; fill: #111827; }
      .subtitle { font: 14px Arial, Helvetica, sans-serif; fill: #4B5563; }
      .panel-title { font: 700 14px Arial, Helvetica, sans-serif; fill: #1E3A8A; }
      .box-title { font: 700 15px Arial, Helvetica, sans-serif; fill: #111827; }
      .box-sub { font: 12px Arial, Helvetica, sans-serif; fill: #4B5563; }
      .caption { font: 11.5px Arial, Helvetica, sans-serif; fill: #6B7280; }
      .edge { font: 11px Arial, Helvetica, sans-serif; fill: #374151; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="2000" height="1080" fill="#FFFFFF"/>
  <text x="36" y="38" class="title">ResilienceOps - current runtime architecture</text>
  <text x="36" y="62" class="subtitle">Compose lab: services, Prometheus alert rules, Alertmanager, incident-bridge, Grafana. k3s sandbox: Red/Blue chaos agents. Grok Bot template AI Incident Diagnosis opens GitHub issues and chat-pings the owner.</text>

  <!-- Panels -->
  <rect x="24" y="80" width="210" height="770" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="40" y="108" class="panel-title">1. Workload</text>

  <rect x="250" y="80" width="400" height="770" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="266" y="108" class="panel-title">2. Target microservices</text>

  <rect x="666" y="80" width="250" height="770" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="682" y="108" class="panel-title">3. k3s sre-agent-sandbox</text>

  <rect x="932" y="80" width="516" height="770" rx="14" fill="#EEF2FF" stroke="#A5B4FC"/>
  <text x="948" y="108" class="panel-title">4. Observability (localhost binds)</text>

  <rect x="1464" y="80" width="512" height="770" rx="14" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="1480" y="108" class="panel-title">5. Grok Bot AI Incident Diagnosis</text>

  <!-- Workload -->
  <rect x="42" y="150" width="174" height="120" rx="12" fill="#FFFFFF" stroke="#4338CA" stroke-width="2"/>
  <text x="129" y="192" text-anchor="middle" class="box-title">Traffic generator</text>
  <text x="129" y="216" text-anchor="middle" class="box-sub">compose RPS_TARGET=20</text>
  <text x="129" y="236" text-anchor="middle" class="box-sub">api-gw:8000</text>

  <!-- Services -->
  <rect x="270" y="150" width="360" height="88" rx="12" fill="#FFFFFF" stroke="#4338CA" stroke-width="2"/>
  <text x="450" y="184" text-anchor="middle" class="box-title">api-gw :8000</text>
  <text x="450" y="208" text-anchor="middle" class="box-sub">proxies /api/orders and /api/payments</text>

  <rect x="270" y="278" width="360" height="108" rx="12" fill="#FFFFFF" stroke="#4338CA" stroke-width="2"/>
  <text x="450" y="314" text-anchor="middle" class="box-title">order-service :8001</text>
  <text x="450" y="338" text-anchor="middle" class="box-sub">/fault/leak-memory, redis-starvation,</text>
  <text x="450" y="358" text-anchor="middle" class="box-sub">cpu-burn, crash  + Redis/Postgres</text>

  <rect x="270" y="426" width="170" height="80" rx="12" fill="#FFFFFF" stroke="#64748B"/>
  <text x="355" y="458" text-anchor="middle" class="box-title">Redis 7</text>
  <text x="355" y="482" text-anchor="middle" class="box-sub">maxclients 50</text>

  <rect x="460" y="426" width="170" height="80" rx="12" fill="#FFFFFF" stroke="#64748B"/>
  <text x="545" y="458" text-anchor="middle" class="box-title">PostgreSQL 16</text>
  <text x="545" y="482" text-anchor="middle" class="box-sub">orders_db</text>

  <rect x="270" y="546" width="360" height="100" rx="12" fill="#FFFFFF" stroke="#4338CA" stroke-width="2"/>
  <text x="450" y="582" text-anchor="middle" class="box-title">payment-service :8002</text>
  <text x="450" y="606" text-anchor="middle" class="box-sub">/fault/latency, drop-rate, outage</text>
  <text x="450" y="626" text-anchor="middle" class="box-sub">Linux tc netem on eth0</text>

  <text x="450" y="690" text-anchor="middle" class="caption">Prometheus scrapes /metrics on :8000 :8001 :8002 every 1s</text>
  <text x="450" y="710" text-anchor="middle" class="caption">(no long scrape line drawn across the k3s column)</text>

  <!-- k3s agents -->
  <rect x="684" y="150" width="214" height="150" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="791" y="186" text-anchor="middle" class="box-title">Red Team (chaos)</text>
  <text x="791" y="212" text-anchor="middle" class="box-sub">Attack planner</text>
  <text x="791" y="232" text-anchor="middle" class="box-sub">Server resource stresser</text>
  <text x="791" y="252" text-anchor="middle" class="box-sub">Network delay injector</text>
  <text x="791" y="276" text-anchor="middle" class="caption">POST /fault/* and tc netem</text>

  <rect x="684" y="340" width="214" height="160" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="791" y="376" text-anchor="middle" class="box-title">Blue Team (heal)</text>
  <text x="791" y="402" text-anchor="middle" class="box-sub">Health monitor (SLO probes)</text>
  <text x="791" y="422" text-anchor="middle" class="box-sub">RCA diagnostician</text>
  <text x="791" y="442" text-anchor="middle" class="box-sub">Remediator + post-mortem</text>
  <text x="791" y="472" text-anchor="middle" class="caption">GET /health then reset runbooks</text>

  <rect x="684" y="546" width="214" height="88" rx="12" fill="#FFFFFF" stroke="#64748B"/>
  <text x="791" y="580" text-anchor="middle" class="box-title">cgroup / RBAC / NP</text>
  <text x="791" y="604" text-anchor="middle" class="box-sub">500m CPU, 512Mi, egress 443</text>

  <!-- Observability: Prometheus + Grafana side by side so alert path does not go through Grafana -->
  <rect x="952" y="140" width="300" height="210" rx="12" fill="#FFFFFF" stroke="#4338CA" stroke-width="2"/>
  <text x="1102" y="168" text-anchor="middle" class="box-title">Prometheus v2.52.0</text>
  <text x="1102" y="190" text-anchor="middle" class="box-sub">scrape + evaluate every 1s</text>
  <text x="1102" y="208" text-anchor="middle" class="box-sub">127.0.0.1:9090  (localhost only)</text>
  <text x="1102" y="232" text-anchor="middle" class="box-title">rule_files: alerts.yml</text>
  <text x="1102" y="254" text-anchor="middle" class="box-sub">ServiceDown</text>
  <text x="1102" y="272" text-anchor="middle" class="box-sub">5xx + p99 SLO (2% / 1200ms)</text>
  <text x="1102" y="290" text-anchor="middle" class="box-sub">memory leak, Redis maxclients 50</text>
  <text x="1102" y="308" text-anchor="middle" class="box-sub">payment outage / latency</text>
  <text x="1102" y="332" text-anchor="middle" class="caption">dashboards/alerts.yml</text>

  <rect x="1272" y="140" width="156" height="210" rx="12" fill="#FFFFFF" stroke="#4338CA" stroke-width="2"/>
  <text x="1350" y="200" text-anchor="middle" class="box-title">Grafana</text>
  <text x="1350" y="224" text-anchor="middle" class="box-title">10.4.2 :3000</text>
  <text x="1350" y="250" text-anchor="middle" class="box-sub">liveNow dashboard</text>
  <text x="1350" y="270" text-anchor="middle" class="box-sub">reads Prometheus</text>
  <text x="1350" y="300" text-anchor="middle" class="caption">not on the alert path</text>

  <rect x="952" y="400" width="476" height="100" rx="12" fill="#FFFFFF" stroke="#4338CA" stroke-width="2"/>
  <text x="1190" y="436" text-anchor="middle" class="box-title">Alertmanager v0.27.0</text>
  <text x="1190" y="460" text-anchor="middle" class="box-sub">group_wait 5s, group_interval 15s, repeat 1h</text>
  <text x="1190" y="480" text-anchor="middle" class="box-sub">send_resolved: true  |  127.0.0.1:9093 only</text>

  <rect x="952" y="548" width="476" height="130" rx="12" fill="#FFFFFF" stroke="#4338CA" stroke-width="2"/>
  <text x="1190" y="580" text-anchor="middle" class="box-title">incident-bridge :8088</text>
  <text x="1190" y="604" text-anchor="middle" class="box-sub">PromQL summaries, log tail, optional k8s events</text>
  <text x="1190" y="624" text-anchor="middle" class="box-sub">5 min fingerprint+status dedupe, ~100KB cap</text>
  <text x="1190" y="644" text-anchor="middle" class="box-sub">GET /healthz   POST /webhook (container :8080)</text>
  <text x="1190" y="664" text-anchor="middle" class="caption">drops if GROK_WEBHOOK_URL is empty</text>

  <!-- Grok -->
  <rect x="1484" y="140" width="472" height="140" rx="12" fill="#FFFFFF" stroke="#047857" stroke-width="2"/>
  <text x="1720" y="176" text-anchor="middle" class="box-title">Grok Bot webhook</text>
  <text x="1720" y="202" text-anchor="middle" class="box-sub">template: AI Incident Diagnosis</text>
  <text x="1720" y="222" text-anchor="middle" class="box-sub">x.ai/bot/feQpDSeSki7HVgkDCBUaY</text>
  <text x="1720" y="252" text-anchor="middle" class="caption">read-only: never restart, scale, rollback, or push</text>

  <rect x="1484" y="330" width="472" height="120" rx="12" fill="#FFFFFF" stroke="#047857" stroke-width="2"/>
  <text x="1720" y="366" text-anchor="middle" class="box-title">Diagnose</text>
  <text x="1720" y="392" text-anchor="middle" class="box-sub">evidence bundle + recent GitHub commits</text>
  <text x="1720" y="412" text-anchor="middle" class="box-sub">JSON source = resilienceops</text>
  <text x="1720" y="432" text-anchor="middle" class="caption">webhook key is never logged</text>

  <rect x="1484" y="500" width="226" height="110" rx="12" fill="#FFFFFF" stroke="#047857" stroke-width="2"/>
  <text x="1597" y="536" text-anchor="middle" class="box-title">GitHub issue</text>
  <text x="1597" y="560" text-anchor="middle" class="box-sub">label: incident</text>
  <text x="1597" y="580" text-anchor="middle" class="box-sub">same fingerprint: comment</text>

  <rect x="1730" y="500" width="226" height="110" rx="12" fill="#FFFFFF" stroke="#047857" stroke-width="2"/>
  <text x="1843" y="536" text-anchor="middle" class="box-title">Owner chat ping</text>
  <text x="1843" y="560" text-anchor="middle" class="box-sub">firing + critical only</text>
  <text x="1843" y="580" text-anchor="middle" class="box-sub">per import ping preference</text>

  <text x="1720" y="650" text-anchor="middle" class="caption">Resolved alerts comment on the open issue. Bot self-healing is roadmap v2.</text>

  <!-- traffic to gw -->
  <line x1="216" y1="210" x2="270" y2="194" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="228" y="190" class="edge">HTTP</text>

  <!-- gw to order to datastores to payment -->
  <line x1="450" y1="238" x2="450" y2="278" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="458" y="264" class="edge">/api/orders</text>
  <line x1="355" y1="386" x2="355" y2="426" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="545" y1="386" x2="545" y2="426" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="450" y1="506" x2="450" y2="546" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="458" y="532" class="edge">POST /payments</text>

  <!-- k3s acts on services -->
  <line x1="684" y1="210" x2="630" y2="210" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="632" y="200" class="edge" fill="#B91C1C">faults</text>
  <line x1="684" y1="400" x2="630" y2="330" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="618" y="370" class="edge" fill="#1D4ED8">detect / reset</text>

  <!-- observability arrows: Prom -> Grafana (side), Prom -> AM (down), AM -> bridge -->
  <line x1="1252" y1="245" x2="1272" y2="245" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="1248" y="236" class="edge">PromQL</text>
  <line x1="1102" y1="350" x2="1102" y2="400" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="1110" y="380" class="edge">firing rules</text>
  <line x1="1190" y1="500" x2="1190" y2="548" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="1198" y="528" class="edge">POST /webhook</text>

  <!-- bridge to grok -->
  <polyline points="1428,613 1464,613 1464,210 1484,210" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="1328" y="700" class="edge" fill="#047857">enriched JSON</text>

  <!-- grok internals -->
  <line x1="1720" y1="280" x2="1720" y2="330" stroke="#047857" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <line x1="1597" y1="450" x2="1597" y2="500" stroke="#047857" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <line x1="1843" y1="450" x2="1843" y2="500" stroke="#047857" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <!-- footer -->
  <rect x="24" y="866" width="1952" height="190" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="896" class="box-title">End-to-end after a fault (code paths A + B)</text>
  <text x="44" y="922" class="box-sub">1. Fault injection - orchestrator.py phases 2-3: Red strategist plans; InfraDisruptorAgent POSTs order-service /fault/* or NetworkAdversaryAgent POSTs payment-service tc netem.</text>
  <text x="44" y="944" class="box-sub">2. Detection - phase 4: IncidentMonitor GET /health (and PromQL if PROMETHEUS_URL answers); evaluate_slos vs 1200ms / 2%. Prometheus evaluates alerts.yml every 1s in parallel.</text>
  <text x="44" y="966" class="box-sub">3. Alert - firing rules go to Alertmanager, which groups and POSTs to incident-bridge:8080/webhook (send_resolved true). 4. Enrichment - bridge attaches PromQL/log/k8s evidence, caps ~100KB, dedupes 5 min.</text>
  <text x="44" y="988" class="box-sub">5. Diagnosis - Path A DiagnosticAgent.analyze (optional k8s + MODEL_DIAGNOSTIC_RCA). Path B Grok Bot uses evidence + recent commits. 6. Issue - bot opens GitHub issue labeled incident (or comments); critical firing also chat-pings owner.</text>
  <text x="44" y="1010" class="box-sub">7. Resolution - Path A RemediatorAgent FaultCatalog.reset_environment (+ optional k8s restart/scale), verify GET /health 200 and latency &lt; 800ms (5 tries), post-mortem in reports/. Path B resolved webhook: bot comments. Bot does not mutate the cluster.</text>
  <text x="44" y="1038" class="caption">Source: docs/architecture.svg (canonical) and docs/architecture.mmd. Render: scripts/render_architecture.sh (rsvg-convert, Chrome fallback). Image: docs/images/infraattack_platform_architecture.png</text>
</svg>
