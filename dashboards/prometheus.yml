global:
  scrape_interval: 1s        # Real-time sub-second metric collection
  evaluation_interval: 1s
  external_labels:
    cluster: resilienceops

# Alerting rules. Thresholds match agents/config.py SLO defaults:
#   SLO_MAX_P99_LATENCY_MS=1200  -> 1.2 seconds
#   SLO_MAX_ERROR_RATE_PERCENT=2.0
# Redis maxclients is 50 (docker-compose redis command).
rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - scheme: http
      timeout: 5s
      api_version: v2
      static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "api-gw"
    static_configs:
      - targets: ["api-gw:8000"]

  - job_name: "order-service"
    static_configs:
      - targets: ["order-service:8001"]

  - job_name: "payment-service"
    static_configs:
      - targets: ["payment-service:8002"]
