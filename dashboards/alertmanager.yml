global:
  resolve_timeout: 2m

route:
  receiver: incident-bridge
  group_by: ["alertname", "service"]
  group_wait: 5s
  group_interval: 15s
  repeat_interval: 1h

receivers:
  - name: incident-bridge
    webhook_configs:
      - url: http://incident-bridge:8080/webhook
        send_resolved: true
        max_alerts: 0

inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: ["service"]
