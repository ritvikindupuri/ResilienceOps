services:
  api-gw:
    build:
      context: ./services/api-gw
    ports:
      - "8000:8000"
    environment:
      - ORDER_SERVICE_URL=http://order-service:8001
      - PAYMENT_SERVICE_URL=http://payment-service:8002
    depends_on:
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  order-service:
    build:
      context: ./services/order-service
    ports:
      - "8001:8001"
    cap_add:
      - NET_ADMIN
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=sre_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sre_password}
      - POSTGRES_DB=orders_db
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  payment-service:
    build:
      context: ./services/payment-service
    ports:
      - "8002:8002"
    cap_add:
      - NET_ADMIN
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--maxclients", "50"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=sre_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sre_password}
      - POSTGRES_DB=orders_db
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sre_user -d orders_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  traffic-generator:
    build:
      context: ./traffic-generator
    environment:
      - GATEWAY_URL=http://api-gw:8000
      - RPS_TARGET=${RPS_TARGET:-20}
      - CONCURRENCY=${CONCURRENCY:-8}
    depends_on:
      api-gw:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.52.0
    # Loopback: local curl and SSM port forwarding. Grafana scrapes on the
    # compose network (no host bind needed). On AWS, deploy_remote.py also
    # merges docker-compose.prom-lan.yml so k3s pods can query
    # http://<private-ip>:9090. Never 0.0.0.0; ingress_sg does not open 9090
    # (only 3000/8000 to allowed_cidr).
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./dashboards/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./dashboards/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      api-gw:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
      - "--cluster.listen-address="
    # Lab testing via amtool/curl; not published on 0.0.0.0.
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./dashboards/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      incident-bridge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10

  incident-bridge:
    build:
      context: ./services/incident-bridge
    # Webhook ingress is compose-internal; host bind is localhost-only for /healthz and synthetic tests.
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      - GROK_WEBHOOK_URL=${GROK_WEBHOOK_URL:-}
      - GROK_WEBHOOK_KEY=${GROK_WEBHOOK_KEY:-}
      - GROK_WEBHOOK_AUTH_HEADER=${GROK_WEBHOOK_AUTH_HEADER:-Authorization}
      - GROK_WEBHOOK_AUTH_SCHEME=${GROK_WEBHOOK_AUTH_SCHEME-Bearer}
      - PROMETHEUS_URL=${BRIDGE_PROMETHEUS_URL:-http://prometheus:9090}
      - AGENT_ACTIVITY_LOG=/app/logs/agent_activity.jsonl
      - EVIDENCE_WINDOW_SECONDS=${EVIDENCE_WINDOW_SECONDS:-600}
      - PAYLOAD_MAX_BYTES=${PAYLOAD_MAX_BYTES:-102400}
      - DEDUPE_TTL_SECONDS=${DEDUPE_TTL_SECONDS:-300}
      - WEBHOOK_TIMEOUT_SECONDS=${WEBHOOK_TIMEOUT_SECONDS:-10}
      - WEBHOOK_MAX_RETRIES=${WEBHOOK_MAX_RETRIES:-3}
      - LOG_TAIL_LINES=${LOG_TAIL_LINES:-40}
      - K8S_EVIDENCE_ENABLED=${K8S_EVIDENCE_ENABLED:-true}
    # rw so failed webhook payloads can be dead-lettered under logs/ (never includes the key).
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./dashboards/provisioning:/etc/grafana/provisioning
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Autonomous Agent Sandbox Container (Runs Red Team vs Blue Team cycles in isolation).
  # Opt-in: `docker compose --profile agents up -d`. Default `docker compose up` is the
  # observability lab only (services, Prometheus, Alertmanager, bridge, Grafana).
  agent-sandbox:
    profiles:
      - agents
    build:
      context: .
      dockerfile: Dockerfile.agent-sandbox
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - API_GATEWAY_URL=http://api-gw:8000
      - ORDER_SERVICE_URL=http://order-service:8001
      - PAYMENT_SERVICE_URL=http://payment-service:8002
      - PROMETHEUS_URL=http://prometheus:9090
      - SLO_MAX_P99_LATENCY_MS=${SLO_MAX_P99_LATENCY_MS:-1200.0}
      - SLO_MAX_ERROR_RATE_PERCENT=${SLO_MAX_ERROR_RATE_PERCENT:-2.0}
      - FAULT_HOLD_SECONDS=${FAULT_HOLD_SECONDS:-120}
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
    depends_on:
      api-gw:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      grafana:
        condition: service_healthy
