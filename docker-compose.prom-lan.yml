# AWS / k3s overlay. Not used by a plain `docker compose up` on a laptop.
# deploy_remote.py (and deploy_k8s_sandbox.py) merge this file after writing
# PROMETHEUS_BIND=<instance private IP> into the host .env.
#
# Effect: Prometheus is reachable at http://<private-ip>:9090 from k3s pods
# on the same EC2 host (local delivery; no security-group hop). ingress_sg
# still does not open 9090 — only Grafana 3000 and API 8000 to allowed_cidr.
# Do not set PROMETHEUS_BIND=0.0.0.0.
services:
  prometheus:
    ports:
      - "${PROMETHEUS_BIND}:9090:9090"
