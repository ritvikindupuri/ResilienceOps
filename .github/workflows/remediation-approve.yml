name: record remediator approval

# Records `/approve` on an `incident` issue. Does not run the fix.
# A GitHub-hosted runner cannot reach a local Compose stack (or the AWS
# host unless you add credentials we do not add here — no IAM changes).
# The host poller `python3 remediation/poll_and_apply.py` executes the action.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  record-approval:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Record approval if the comment is a valid /approve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python3 remediation/record_approval.py
